# 在 issue / PR 里留言 /oc（或 /opencode）让智谱 GLM-5.3 干活；/ocv 用带看图的 GLM-5.3-Flash。
# 需要仓库 Secret：ZHIPU_API_KEY（Settings → Secrets and variables → Actions）。
name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    # 公开仓库里任何 GitHub 用户都能留言；只认仓库主人和协作者，防止陌生人用 /oc 花掉智谱额度、改仓库
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      !contains(github.event.comment.body, '/ocv')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup git identity
        run: |
          git config user.name "opencode-agent"
          git config user.email "285012672+ddiinngg6-star@users.noreply.github.com"
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: zhipu/glm-5.3
          use_github_token: true
          # 思考挡位可改：low / medium / high
          variant: high
  opencode-vision:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/ocv')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup git identity
        run: |
          git config user.name "opencode-agent"
          git config user.email "285012672+ddiinngg6-star@users.noreply.github.com"
      - name: Run OpenCode (vision)
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: zhipu/glm-5.3-flash
          variant: high
          use_github_token: true
          mentions: /ocv
