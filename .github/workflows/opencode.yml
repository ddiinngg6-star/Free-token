name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      !contains(github.event.comment.body, '/ocv')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup git identity
        run: |
          git config user.name "opencode-agent"
          git config user.email "285012672+ddiinngg6-star@users.noreply.github.com"
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: zhipu/glm-5.3
          use_github_token: true
          # 思考挡位可改：low / medium / high
          variant: high
  opencode-vision:
    if: |
      contains(github.event.comment.body, '/ocv')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup git identity
        run: |
          git config user.name "opencode-agent"
          git config user.email "285012672+ddiinngg6-star@users.noreply.github.com"
      - name: Run OpenCode (vision)
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: zhipu/glm-5.3-flash
          variant: high
          use_github_token: true
          mentions: /ocv
